[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "security-agent"
version = "0.1.0"
description = "CLI-first Solidity security analysis skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
security-agent = "security_agent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]